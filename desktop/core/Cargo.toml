[package]
name = "traework2api-core"
version = "0.4.17"
edition = "2021"

[lib]
name = "traework2api_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "gzip"] }
axum = { version = "0.8", features = ["json"] }
futures-util = "0.3"
aes = "0.8"
aes-gcm = "0.10"
block-padding = "0.3"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
ecb = { version = "0.1", features = ["alloc", "block-padding"] }
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
rsa = { version = "0.9", features = ["sha2"] }
num-bigint = "0.4"
chrono = "0.4"
