name: Build APK

on:
  push:
    branches: [main, "qoder/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    name: build-apk.ps1 (debug APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ships an Android SDK; compileSdk 36 / build-tools 36.0.0 may be
      # missing. AGP auto-downloads them, so this step is best-effort only (never fails).
      - name: Ensure Android SDK (android-36 / build-tools 36.0.0)
        continue-on-error: true
        run: |
          SDKM="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(command -v sdkmanager || true)"
          [ -n "$SDKM" ] || SDKM="$(find /usr/local/lib/android/sdk -name sdkmanager -type f | head -1 || true)"
          if [ -n "$SDKM" ] && [ -x "$SDKM" ]; then
            yes | "$SDKM" --licenses >/dev/null 2>&1 || true
            "$SDKM" "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true
          fi

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Build through build-apk.ps1 (same script used locally). -Online because a cold
      # CI dependency cache cannot satisfy --offline.
      - name: Run build-apk.ps1
        shell: pwsh
        run: ./build-apk.ps1 -Online

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TraeWork2API-debug-${{ github.sha }}
          path: out/TraeWork2API-*-debug.apk
          if-no-files-found: error
