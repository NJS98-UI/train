name: Build Desktop

on:
  push:
    branches: [main, "qoder/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (tw-core + frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('desktop/Cargo.lock') }}

      - name: Rust tests (tw-core)
        working-directory: desktop
        run: cargo test -p tw-core

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Frontend typecheck + build
        working-directory: desktop/frontend
        run: |
          npm ci
          npx tsc --noEmit
          npm run build

  # Windows 安装包（用户目标平台）。首跑允许失败：tauri bundle 图标/nsis 细节可能需要补。
  package-windows:
    name: tauri bundle (windows)
    needs: test
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install frontend deps
        working-directory: desktop/frontend
        run: npm ci

      - name: Build frontend (dist for tauri assets)
        working-directory: desktop/frontend
        run: npm run build

      - name: Build tauri app (windows, portable exe)
        working-directory: desktop
        run: cargo build --release -p tw-app

      - name: UPX compress exe
        shell: pwsh
        run: |
          choco install upx -y --no-progress
          upx --best --lzma desktop/target/release/tw-app.exe
          upx -t desktop/target/release/tw-app.exe

      - name: Upload tauri exe
        uses: actions/upload-artifact@v4
        with:
          name: TraeWork2API-desktop-windows-${{ github.sha }}
          path: desktop/target/release/*.exe
          if-no-files-found: error
